<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNCTRL | Creative marketing studio</title>
<meta name="description" content="UNCTRL is a creative marketing studio. Branding, content, production and campaigns for brands that would rather be remembered than be safe.">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0B0B0B">
<meta property="og:title" content="UNCTRL | Creative marketing studio">
<meta property="og:description" content="Uncontrolled ideas. Controlled results.">
<meta property="og:image" content="https://unctrl-eg.com/og-image-1200x630.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body data-page="home">

<header class="site-head">
  <div class="wrap">
    <a class="brand" href="/" aria-label="UNCTRL home">
      <img class="icon" src="/assets/brand/unctrl-icon-gradient.svg" alt="">
      <img class="word" src="/assets/brand/unctrl-logo-gradient.svg" alt="UNCTRL">
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#work">Work</a>
      <a href="#process">Process</a>
      <a class="keep" href="#contact">Contact</a>
    </nav>
  </div>
</header>

<main>
  <div class="hero">
    <div class="hero-card">
      <span class="hero-slash two" aria-hidden="true"></span>
      <span class="hero-slash" aria-hidden="true"></span>
      <div class="hero-inner">
        <h1><img class="hero-logo" src="/assets/brand/unctrl-logo-tagline-gradient.svg" alt="UNCTRL"><span class="sr-only" id="tagline-sr"></span></h1>
        <div class="hero-actions" id="hero-actions" hidden>
          <button class="play" id="play" type="button" aria-label="Play showreel"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg></button>
          <span class="play-label">Play showreel</span>
        </div>
      </div>
      <a class="scroll-cue" href="#work">Scroll</a>
    </div>
  </div>

  <div class="marquee" aria-hidden="true"><div class="marquee-track" id="marquee"></div></div>

  <section id="work">
    <div class="wrap">
      <div class="sec-head">
        <h2 class="display" id="work-title"></h2>
        <div class="filters" id="filters" role="group" aria-label="Filter projects"></div>
      </div>
      <div class="work-grid" id="work-grid"></div>
    </div>
  </section>

  <section class="process" id="process">
    <div class="wrap"><div class="steps" id="steps"></div></div>
  </section>

  <section class="clients" id="clients" hidden>
    <div class="wrap">
      <span class="label" id="clients-title"></span>
      <div class="logos" id="logos"></div>
    </div>
  </section>

  <section class="contact" id="contact">
    <span class="slash-bg" aria-hidden="true"></span>
    <div class="wrap">
      <div>
        <h2 class="display" id="contact-title"></h2>
        <p class="lead" id="contact-text"></p>
        <div class="direct" id="direct"></div>
      </div>
      <form class="cform" id="cform" novalidate>
        <label>Name<input name="name" autocomplete="name" required></label>
        <label>Brand<input name="brand" autocomplete="organization"></label>
        <label class="full">Email or phone<input name="contact" autocomplete="email" required></label>
        <label class="full">What do you need?<textarea name="message" required></textarea></label>
        <button class="btn btn-solid" type="submit">Send</button>
        <p class="form-msg" id="form-msg" role="status"></p>
      </form>
    </div>
  </section>
</main>

<footer class="site-foot">
  <div class="wrap"><span id="foot-copy"></span><nav id="foot-social" aria-label="Social"></nav></div>
</footer>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Showreel">
  <button class="btn btn-line close" type="button">Close</button>
  <div class="frame"></div>
</div>

<script src="/assets/app.js"></script>
</body>
</html>
