<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNCTRL | Creative marketing studio</title>
<meta name="description" content="We build brands people remember, make content they stop for, and run the media that turns attention into growth.">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0B0B0B">
<meta property="og:title" content="UNCTRL | Creative marketing studio">
<meta property="og:description" content="We build brands people remember, make content they stop for, and run the media that turns attention into growth.">
<meta property="og:image" content="https://unctrl-eg.com/og-image-1200x630.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body id="top" data-page="home">
<div class="grain" aria-hidden="true"></div>
<div class="cursor" aria-hidden="true"><span>View</span></div>
<header class="site-head">
  <div class="bar">
    <a class="brand" href="/" aria-label="UNCTRL home">
      <img class="icon" src="/assets/brand/unctrl-icon-gradient.svg" alt="">
      <img class="word" src="/assets/brand/unctrl-logo-gradient.svg" alt="UNCTRL">
    </a>
    <nav class="nav" aria-label="Main"><a href="/" aria-current=page>Home</a><a href="/services">Services</a><a href="/about">About</a><a href="/studio">Studio</a><a href="/contact">Contact</a></nav>
    <a class="btn btn-solid nav-cta" href="/contact">Start a project</a>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="mnav"><span></span><span></span><span class="sr-only">Menu</span></button>
  </div>
</header>
<div class="mnav" id="mnav" hidden>
  <nav aria-label="Mobile"><a href="/" aria-current=page>Home</a><a href="/services">Services</a><a href="/about">About</a><a href="/studio">Studio</a><a href="/contact">Contact</a></nav>
  <a class="btn btn-solid" href="/contact">Start a project</a>
</div>
<main>

<section class="hero2">
  <div class="hero2-media intro" id="hero-media">
    <img id="hero-img" alt="">
    <span class="hero2-slash" aria-hidden="true"></span>
  </div>
  <div class="wrap hero2-inner">
    <span class="label intro" id="hero-label"></span>
    <h1 class="display hero2-title" id="hero-title"></h1>
    <p class="hero2-text intro d2" id="hero-text"></p>
    <div class="hero-actions intro d3">
      <a class="btn btn-solid" href="/studio">See the work</a>
      <a class="btn btn-line" href="/contact">Let's talk</a>
      <button class="play" id="play" type="button" hidden><span class="ring"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg></span>Showreel</button>
    </div>
  </div>
  <div class="wrap hero2-foot intro d3"><span class="label" id="hero-strip"></span><a class="scroll-cue" href="#work"><span></span>Scroll</a></div>
</section>

<div class="tapes" aria-hidden="true">
  <div class="tape t2"><div class="tape-track" id="tape2"></div></div>
  <div class="tape t1"><div class="tape-track" id="tape1"></div></div>
</div>

<section id="work">
  <div class="wrap">
    <div class="sec-head"><h2 class="display reveal" id="work-title"></h2><a class="btn btn-line fade" href="/studio">All projects</a></div>
    <div class="rows" id="work-rows"></div>
  </div>
  <img class="row-preview" id="row-preview" alt="" aria-hidden="true">
</section>

<section class="band">
  <div class="wrap band-grid">
    <h2 class="display reveal" id="statement-title"></h2>
    <p class="fade" id="statement-text"></p>
  </div>
</section>

<section class="svc-preview">
  <div class="wrap">
    <div class="sec-head"><div><span class="label fade" id="svc-label"></span><h2 class="display reveal" id="svc-title"></h2></div><a class="btn btn-line fade" href="/services">All services</a></div>
    <div class="svc-grid" id="svc-grid"></div>
  </div>
</section>

<section class="beliefs-sec">
  <div class="wrap">
    <span class="label fade" id="beliefs-label"></span>
    <div class="beliefs" id="beliefs"></div>
  </div>
</section>

<section class="clients" id="clients" hidden>
  <div class="wrap"><span class="label" id="clients-title"></span><div class="logos" id="logos"></div></div>
</section>
<section class="cta-band">
  <span class="glow g1" aria-hidden="true"></span>
  <div class="wrap">
    <h2 class="display reveal" id="cta-title"></h2>
    <div class="cta-actions fade"><a class="btn btn-white" href="/contact">Start a project</a><a class="btn btn-line" id="cta-mail" href="/contact">Email us</a></div>
  </div>
</section>
</main>
<footer class="site-foot">
  <div class="wrap">
    <div class="foot-cols">
      <div><span class="label">Navigate</span><a href="/">Home</a><a href="/services">Services</a><a href="/about">About</a><a href="/studio">Studio</a><a href="/contact">Contact</a></div>
      <div><span class="label">Say hello</span><div id="foot-contact"></div></div>
      <div><span class="label">Follow</span><div id="foot-social"></div></div>
      <div class="foot-up"><a href="#top" class="up" aria-label="Back to top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></a></div>
    </div>
    <img class="foot-logo" src="/assets/brand/unctrl-logo-white.svg" alt="" aria-hidden="true">
    <div class="row"><span id="foot-copy"></span><span id="foot-address"></span></div>
  </div>
</footer>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Video">
  <button class="btn btn-line close" type="button">Close</button>
  <div class="frame"></div>
</div>
<script src="/assets/app.js"></script>
</body>
</html>
