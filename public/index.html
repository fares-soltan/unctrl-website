<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNCTRL | Creative marketing studio</title>
<meta name="description" content="UNCTRL is a creative marketing studio. We build brands people remember, make content they stop for, and run the media that turns attention into growth.">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0B0B0B">
<meta property="og:title" content="UNCTRL | Creative marketing studio">
<meta property="og:description" content="Uncontrolled ideas. Controlled results.">
<meta property="og:image" content="https://unctrl-eg.com/og-image-1200x630.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body data-page="home">
<div class="grain" aria-hidden="true"></div>
<div class="cursor" aria-hidden="true"><span>View</span></div>

<header class="site-head">
  <div class="bar">
    <a class="brand" href="/" aria-label="UNCTRL home">
      <img class="icon" src="/assets/brand/unctrl-icon-gradient.svg" alt="">
      <img class="word" src="/assets/brand/unctrl-logo-gradient.svg" alt="UNCTRL">
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#work">Work</a>
      <a href="#process">Process</a>
      <a class="cta" href="#contact">Start a project</a>
    </nav>
  </div>
</header>

<main>
  <div class="hero">
    <div class="hero-card">
      <span class="glow g1" aria-hidden="true"></span>
      <span class="hero-slash two intro" aria-hidden="true"></span>
      <span class="hero-slash intro" aria-hidden="true"></span>
      <div class="hero-inner">
        <span class="hero-kicker label intro" id="kicker"><i></i><span id="kicker-text"></span></span>
        <h1 class="intro d1"><img class="hero-logo" src="/assets/brand/unctrl-logo-tagline-gradient.svg" alt="UNCTRL"><span class="sr-only" id="tagline-sr"></span></h1>
        <p class="hero-line intro d2" id="hero-line"></p>
        <div class="hero-actions intro d3">
          <a class="btn btn-solid" href="#work">See the work</a>
          <button class="play" id="play" type="button" hidden><span class="ring"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg></span>Play showreel</button>
        </div>
      </div>
      <a class="scroll-cue" href="#work"><span></span>Scroll</a>
    </div>
  </div>

  <div class="tapes" aria-hidden="true">
    <div class="tape t2"><div class="tape-track" id="tape2"></div></div>
    <div class="tape t1"><div class="tape-track" id="tape1"></div></div>
  </div>

  <section id="work">
    <div class="wrap">
      <div class="sec-head">
        <h2 class="display reveal" id="work-title"></h2>
        <div class="filters fade" id="filters" role="group" aria-label="Filter projects"></div>
      </div>
      <div class="work-grid" id="work-grid"></div>
    </div>
  </section>

  <section class="statement">
    <span class="glow g1" aria-hidden="true"></span>
    <div class="wrap">
      <span class="label" id="statement-label"></span>
      <h2 class="display" id="statement"></h2>
    </div>
  </section>

  <section class="process" id="process">
    <span class="glow g2" aria-hidden="true"></span>
    <div class="wrap">
      <div class="sec-head"><h2 class="display reveal" id="process-title"></h2></div>
      <div class="steps" id="steps"></div>
    </div>
  </section>

  <section class="clients" id="clients" hidden>
    <div class="wrap">
      <span class="label" id="clients-title"></span>
      <div class="logos" id="logos"></div>
    </div>
  </section>

  <section class="contact" id="contact">
    <div class="panel">
      <span class="slash-bg" aria-hidden="true"></span>
      <div class="wrap grid">
        <div>
          <h2 class="display reveal" id="contact-title"></h2>
          <p class="lead fade" id="contact-text"></p>
          <div class="direct fade" id="direct"></div>
        </div>
        <form class="cform fade" id="cform" novalidate>
          <label>Name<input name="name" autocomplete="name" required></label>
          <label>Brand<input name="brand" autocomplete="organization"></label>
          <label class="full">Email or phone<input name="contact" autocomplete="email" required></label>
          <label class="full">What do you need?<textarea name="message" required></textarea></label>
          <input class="sr-only" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
          <button class="btn btn-solid" type="submit">Send</button>
          <p class="form-msg" id="form-msg" role="status"></p>
        </form>
      </div>
    </div>
  </section>
</main>

<footer class="site-foot">
  <div class="wrap">
    <div class="foot-big" aria-hidden="true">UNCTRL</div>
    <div class="row"><span id="foot-copy"></span><nav id="foot-social" aria-label="Social"></nav></div>
  </div>
</footer>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Showreel">
  <button class="btn btn-line close" type="button">Close</button>
  <div class="frame"></div>
</div>

<script src="/assets/app.js"></script>
</body>
</html>
